[package]
name = "gnome-quickshare"
version = "0.1.0"
edition = "2024"
default-run = "gnome-quickshare"
license = "GPL-3.0-or-later"
description = "Share a little closer. Quick Share for the GNOME desktop."
repository = "https://github.com/oddship/gnome-quickshare"

[dependencies]
libc = "0.2"
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
rqs_lib = { path = "vendor/rqs_lib", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "background"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["bluetooth"]
test-tools = []
bluetooth = ["rqs_lib/experimental"]

[profile.dev]
debug = 0
[profile.release]
opt-level = 1
codegen-units = 16

[[bin]]
name = "quickshare-probe"
path = "tests/probes/peer.rs"
required-features = ["test-tools"]

[workspace]
members = ["vendor/rqs_lib"]
